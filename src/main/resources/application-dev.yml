server:
  servlet:
    context-path: /ondc

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ondc_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ondc-group
      auto-offset-reset: earliest
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 5000

ondc:
  subscriber-id: ${ONDC_SUBSCRIBER_ID:bap.fooddelivery.com}
  subscriber-url: ${ONDC_SUBSCRIBER_URL:https://bap.fooddelivery.com/ondc}
  unique-key-id: ${ONDC_UK_ID:default-uk-id}
  domain: ${ONDC_DOMAIN:ONDC:RET11}
  city: ${ONDC_CITY:std:080}
  country: ${ONDC_COUNTRY:IND}
  registry:
    url: ${ONDC_REGISTRY_URL:https://staging.registry.ondc.org}
    gateway-url: ${ONDC_GATEWAY_URL:https://staging.gateway.ondc.org}
  crypto:
    signing-private-key: ${ONDC_PRIVATE_SIGNING_KEY:default-key-dev-only}
    signing-public-key: ${ONDC_PUBLIC_SIGNING_KEY:default-key-dev-only}
    encryption-private-key: ${ONDC_PRIVATE_ENC_KEY:default-key-dev-only}
    encryption-public-key: ${ONDC_PUBLIC_ENC_KEY:default-key-dev-only}
